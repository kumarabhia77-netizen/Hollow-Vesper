<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hollow Vesper</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<div id="menu" class="screen"><h1>Hollow Vesper</h1><div class="rule"></div><p>The bells have stopped. Something still answers.</p><button id="start">Begin</button><small>Move: A / D or arrows. Jump: Space. Strike: J. Dodge: Shift. Pause: P.</small></div>
<div id="pause" class="screen hidden"><h2>Paused</h2><button id="resume">Resume</button><button id="snd">Sound: on</button><button id="shk">Screen shake: on</button><button id="quit">Main menu</button></div>
<div id="dead" class="screen hidden"><h2>You have fallen</h2><button id="retry">Rise again</button></div>
<button id="pbtn" class="hidden">II</button>
<div id="touch"><div class="pad"><button data-btn="l">&#9664;</button><button data-btn="r">&#9654;</button></div><div class="pad"><button data-btn="a">Strike</button><button data-btn="e">Dodge</button><button data-btn="j">Jump</button></div></div>
<div id="err" class="hidden"></div>
</div>
<script src="js/config.js"></script><script src="js/input.js"></script><script src="js/sfx.js"></script><script src="js/world.js"></script>
<script src="js/entities.js"></script><script src="js/render.js"></script><script src="js/main.js"></script>
</body></html>
